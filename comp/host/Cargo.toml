[package]
name = "comp-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Native Rust host for ANY composed wasm component: serves its wasi:http/incoming-handler over wasmtime and satisfies its wasi:keyvalue / wasi:config / wasi:blobstore imports host-side. No Kubernetes, no NATS required."

# This is a NATIVE binary (aarch64/x86_64), NOT a wasm component — it is its own
# crate, deliberately OUTSIDE the components/ (wasm32) workspace.
[workspace]

[[bin]]
name = "comp-host"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "47", features = ["component-model", "async"] }
wasmtime-wasi = "47"
wasmtime-wasi-http = "47"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# TLS (rustls + webpki roots) so `--kv redis` can dial managed `rediss://`
# endpoints (DO Managed Valkey, Upstash, …) from a minimal container.
redis = { version = "0.27", features = ["tls-rustls", "tls-rustls-webpki-roots"] }
# The lattice client: inventory, commands, and artifact distribution. Async, unlike
# the `nats` 0.25 above, because a held subscription cannot share a thread with a
# blocking KV call. The two coexist for now — `--kv nats` still uses the old one.
async-nats = "0.38"
futures = "0.3"
# `bundled` compiles SQLite itself: no system libsqlite3 to match, which keeps the
# static musl cross-build for a VPS working (see just selfhost-build-host).
rusqlite = { version = "0.32", features = ["bundled"] }
# Artifacts are content-addressed; the digest is verified before anything is
# compiled, because the object store is not a trust boundary and the digest is.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
