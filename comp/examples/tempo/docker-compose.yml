# tempo, self-contained on one host: Valkey (Redis-compatible) + the tempo
# container. No managed database, no wasmCloud, no TLS — a POC that fits a $6
# droplet. (For HTTPS later, put a DigitalOcean Load Balancer or Cloudflare in
# front of :8080 — no change here.)
#
# Prereqs to BUILD locally (produce the two artifacts the image copies in):
#   just compose-tempo        # -> components/target/tempo_domain.composed.wasm
#   just build-tempo-ui       # -> examples/tempo/dist
#
# Run (HTTP on :8080):
#   cp examples/tempo/.env.example examples/tempo/.env   # set REDIS_PASSWORD
#   docker compose -f examples/tempo/docker-compose.yml --env-file examples/tempo/.env up -d --build
#
# On a droplet you usually DON'T build: set TEMPO_IMAGE=ghcr.io/<you>/tempo-app:TAG
# in .env and `docker compose ... pull && up -d` (skip --build).
services:
  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tempo:
    image: ${TEMPO_IMAGE:-tempo:local}
    build:
      context: ../..
      dockerfile: examples/tempo/Dockerfile
    environment:
      # plain redis:// over the private compose network (no TLS needed here).
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redis-data:
